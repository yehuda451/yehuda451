name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - claude/ios-workout-tracker-dk63z5
    paths:
      - "WorkoutTracker/**"
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode || true

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project WorkoutTracker/WorkoutTracker.xcodeproj \
            -scheme WorkoutTracker \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/WorkoutTracker.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Package IPA (Payload/*.app zipped)
        run: |
          set -e
          APP_PATH="build/WorkoutTracker.xcarchive/Products/Applications/WorkoutTracker.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build did not produce an .app bundle at $APP_PATH"
            find build -maxdepth 4
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r WorkoutTracker.ipa Payload
          cd ..

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutTracker-unsigned-ipa
          path: build/WorkoutTracker.ipa
          retention-days: 14
